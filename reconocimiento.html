<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconocimiento TecnoScan</title>
<style>
  :root{--bg:#0a0f14;--surface:#111820;--border:#28374a;--text:#e9f1f6;--dim:#8fa3b8;--accent:#4de8d4;}
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse 800px 420px at 12% -6%, rgba(77,232,212,.12), transparent 60%),radial-gradient(ellipse 600px 420px at 100% 4%, rgba(216,27,96,.10), transparent 55%),var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;padding:20px 16px 36px;}
  .app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
  .eyebrow{font-family:Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  h1{font-weight:700;font-size:clamp(22px,5.5vw,32px);line-height:1.12;margin:4px 0 0;}
  p{margin:0;color:var(--dim);line-height:1.55;font-size:14.5px;}
  .cert{width:100%;height:auto;display:block;border-radius:8px;background:#fbfaf6;box-shadow:0 10px 40px rgba(0,0,0,.45);}
  .btn{font-family:Consolas,'Courier New',monospace;font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border-radius:12px;padding:15px 22px;border:1px solid transparent;cursor:pointer;text-decoration:none;text-align:center;flex:1 1 200px;}
  .btn-primary{background:var(--accent);color:#062420;box-shadow:0 0 24px rgba(77,232,212,.3);}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .err{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:18px;}
</style>
</head>
<body>
<div class="app">
  <div>
    <div class="eyebrow">TecnoScan · Pabellón STEM</div>
    <h1>Tu reconocimiento</h1>
  </div>
  <div class="err" id="err" hidden><p>Este enlace está incompleto. Vuelve a generar tu código QR desde la pantalla de resultados del reto.</p></div>
  <div id="ok" hidden style="display:flex;flex-direction:column;gap:18px;">
    <img class="cert" id="cert" alt="Reconocimiento por participar en el reto TecnoScan">
    <div class="row">
      <a class="btn btn-primary" id="dl" download="reconocimiento-tecnoscan.png">Descargar imagen</a>
      <a class="btn btn-ghost" href="reto.html">Ir al reto</a>
    </div>
    <p>En el celular, si la descarga no inicia, mantén presionada la imagen y elige “Guardar imagen”.</p>
  </div>
</div>
