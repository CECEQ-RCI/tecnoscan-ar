<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubo AR STEM</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  /* z-index: 0 crea una capa propia: MindAR pone el video de la cámara con z-index -2 y,
     sin esto, el fondo negro del body lo tapa (pantalla negra con el recuadro de escaneo). */
  #container { position: absolute; inset: 0; z-index: 0; }
  #inicio { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; background: #1d3557; color: #fff; text-align: center; padding: 24px; }
  #inicio h1 { margin: 0 0 8px; }
  #inicio button { font-size: 1.25rem; width: min(320px, 100%); padding: 14px; border: 0; border-radius: 12px;
                   background: #e63946; color: #fff; }
  #sonido { position: absolute; right: 16px; bottom: 16px; z-index: 5; font-size: 1.1rem; padding: 10px 16px;
            border: 0; border-radius: 10px; background: rgba(255,255,255,.85); display: none; }
  #titulo { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: calc(100% - 32px);
            padding: 10px 18px; border-radius: 12px; background: rgba(0,0,0,.7); color: #fff; font-size: clamp(1rem, 4.5vw, 1.6rem);
            font-weight: bold; text-align: center; white-space: nowrap; }
  #titulo[hidden] { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="inicio">
  <h1>Cubo AR STEM</h1>
  <p>Elige qué mostrar y apunta la cámara a cualquier cara del cubo.</p>
  <button data-modo="formula">🧮 Fórmula (a+b)³</button>
  <button data-modo="video">🎬 Video</button>
  <button data-modo="pintura">🖼️ Pintura</button>
  <button data-modo="dinosaurio">🦖 Dinosaurio</button>
</div>
<button id="sonido">🔇 Activar sonido</button>
<div id="titulo" hidden></div>
<div id="container"></div>

<video id="video" src="video.mp4" loop muted playsinline crossorigin="anonymous" preload="auto" style="display:none"></video>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";
import { reloj, actualizaciones, prepararVideo, prepararPintura, prepararDino, prepararFormula, orientarEnCara } from "./contenido.js";

const NUM_CARAS = 6;
const video = document.getElementById("video");

// ---------------- Arranque ----------------
async function iniciar(modo) {
  const preparar = { video: () => prepararVideo(video), pintura: prepararPintura, dinosaurio: prepararDino, formula: prepararFormula }[modo];
  const contenido = await preparar();

  const mindar = new MindARThree({
    container: document.getElementById("container"),
    imageTargetSrc: "targets.mind",
    maxTrack: 2,                              // hasta 2 caras a la vez (se combinan)
    filterMinCF: 0.0001, filterBeta: 0.001,   // menos temblor
  });
  const { renderer, scene, camera } = mindar;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
  const sol = new THREE.DirectionalLight(0xffffff, 1.5);
  sol.position.set(1, 2, 3);
  scene.add(sol);

  // UN SOLO cubo virtual para todo el cubo de papel. Las 6 caras son puntos de detección:
  // cada cara visible "dice" dónde está el cubo completo (su ancla × la orientación de esa cara)
  // y, si se ven varias, se promedian. Medida 1 = ancho de la cara impresa.
  const cubo = contenido.crear();
  cubo.matrixAutoUpdate = false;
  cubo.visible = false;
  scene.add(cubo);

  const anclas = [], ajustes = [];
  for (let i = 0; i < NUM_CARAS; i++) {
    anclas.push(mindar.addAnchor(i));
    const o = orientarEnCara(new THREE.Object3D(), i);
    o.updateMatrix();
    ajustes.push(o.matrix.clone());          // de "cara i" a "centro del cubo"
  }

  const GRACIA_MS = 700;                      // al girar entre caras, el cubo no desaparece
  const SUAVIZADO = 0.5;                      // 0 = sin cambio, 1 = salta directo a la nueva posición
  const pos = new THREE.Vector3(), rot = new THREE.Quaternion(), esc = new THREE.Vector3();
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(), m = new THREE.Matrix4();
  let ultimaDeteccion = -Infinity;

  function ubicarCubo(ahora) {
    let n = 0;
    const sumaP = new THREE.Vector3(), sumaS = new THREE.Vector3(), promQ = new THREE.Quaternion();
    anclas.forEach((ancla, i) => {
      if (!ancla.visible) return;
      m.copy(ancla.group.matrix).multiply(ajustes[i]).decompose(p, q, s);
      sumaP.add(p); sumaS.add(s);
      if (n === 0) promQ.copy(q);
      else { if (promQ.dot(q) < 0) q.set(-q.x, -q.y, -q.z, -q.w); promQ.slerp(q, 1 / (n + 1)); }
      n++;
    });
    if (n > 0) {
      sumaP.divideScalar(n); sumaS.divideScalar(n);
      if (!cubo.visible) { pos.copy(sumaP); rot.copy(promQ); esc.copy(sumaS); }
      else { pos.lerp(sumaP, SUAVIZADO); rot.slerp(promQ, SUAVIZADO); esc.lerp(sumaS, SUAVIZADO); }
      cubo.matrix.compose(pos, rot, esc);
      ultimaDeteccion = ahora;
      if (!cubo.visible) { cubo.visible = true; contenido.alEncontrar?.(); titulo.hidden = !contenido.titulo; }
    } else if (cubo.visible && ahora - ultimaDeteccion > GRACIA_MS) {
      cubo.visible = false; contenido.alPerder?.(); titulo.hidden = true;
    }
  }

  const titulo = document.getElementById("titulo");
  titulo.textContent = contenido.titulo || "";

  await mindar.start();
  renderer.setAnimationLoop(() => {
    const dt = reloj.getDelta();
    ubicarCubo(performance.now());
    actualizaciones.forEach((f) => f(dt));
    renderer.render(scene, camera);
  });
}

for (const btn of document.querySelectorAll("#inicio button")) {
  btn.onclick = async () => {
    const modo = btn.dataset.modo;
    document.getElementById("inicio").style.display = "none";
    if (modo === "video") {
      document.getElementById("sonido").style.display = "block";
      // Desbloquea el video con el clic (requisito de los navegadores móviles)
      try { await video.play(); video.pause(); } catch (e) { console.warn(e); }
    }
    iniciar(modo).catch((e) => { alert(e.message || e); location.reload(); });
  };
}

// También se puede abrir directo con ?modo=formula, ?modo=video, etc.
const modoURL = new URLSearchParams(location.search).get("modo");
if (modoURL) document.querySelector(`#inicio button[data-modo="${modoURL}"]`)?.click();

document.getElementById("sonido").onclick = (ev) => {
  video.muted = !video.muted;
  ev.target.textContent = video.muted ? "🔇 Activar sonido" : "🔊 Silenciar";
};
</script>
</body>
</html>
