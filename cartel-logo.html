<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Nibble sale del logo</title>
<style>html,body{margin:0;height:100%;background:#0a0f14;color:#8fa3b8;font:14px/1.4 monospace;display:flex;align-items:center;justify-content:center;letter-spacing:.08em;text-transform:uppercase;}</style>
</head>
<body>
Cargando…
<noscript><meta http-equiv="refresh" content="0;url=cartel-logo-app.html"></noscript>
<script>
/* Esta página no cambia: solo abre la versión más reciente de Nibble, así el QR impreso siempre carga lo último. */
(function(){
  var qs = location.search.replace(/^\?/, ''), done = false;
  function go(v){ if(done) return; done = true; location.replace('cartel-logo-app.html?v=' + v + (qs ? '&' + qs : '')); }
  setTimeout(function(){ go('0'); }, 2500);
  try {
    fetch('nibble-version.txt?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(v){ go((v || '0').trim() || '0'); })
      .catch(function(){ go('0'); });
  } catch(e){ go('0'); }
})();
</script>
</body>
</html>
